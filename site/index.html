<body>
<div class="wrap" id="app"><p class="muted">Laai...</p></div>

<!-- Netlify Forms needs this form to exist in the static HTML. The app fills and posts it with fetch(). -->
<form name="uitslag" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="uitslag">
  <p><label>Moenie dit invul nie: <input name="bot-field"></label></p>
  <input name="gebruiker"><input name="vak"><input name="onderwerp"><input name="telling">
  <input name="persentasie"><input name="status"><input name="wenke"><input name="foute">
  <input name="tyd_sekondes"><input name="dag"><input name="toestel">
  <textarea name="detail"></textarea><textarea name="verslag"></textarea>
</form>

<script src="/app.js"></script>
</body>
</html>
